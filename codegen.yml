schema:
  - ${VITE_API_URL}:
      headers:
        Authorization: Bearer ${VITE_API_ACCESS_TOKEN}
documents: './src/graphql/**/*.graphql'
generates:
  ./src/graphql/generated.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      reactApolloVersion: 3
      withHooks: true
      withHOC: false
      withComponents: false
